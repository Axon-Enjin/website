<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04060d">
  <title>Axon Enjin — People, connected.</title>
  <meta name="description" content="One system for every branch. Bring your people, stock and reports together with Axon Enjin's Operating Layer. Add the tools you need. Work directly with the builders.">
  <link rel="icon" href="assets/axon-mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/dm-sans.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-serif-italic.ttf" as="font" type="font/ttf" crossorigin>
  <script>
    // Allow a cold production bundle to load before falling back to the static hero.
    try {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches &&
          localStorage.getItem('axon-motion') !== 'paused' &&
          (!location.hash || location.hash === '#home') &&
          (new URLSearchParams(location.search).has('intro') || !sessionStorage.getItem('axon-intro-seen'))) {
        document.documentElement.classList.add('intro-pending');
        window.axonIntroDeadline = setTimeout(function () {
          if (!document.documentElement.classList.contains('intro-active')) {
            document.documentElement.classList.remove('intro-pending');
            document.getElementById('intro-skip')?.remove();
          }
        }, 8000);
      }
    } catch (error) { /* The normal hero is the storage-free fallback. */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <button class="intro-skip" id="intro-skip" type="button" onclick="document.documentElement.classList.remove('intro-pending','intro-active');this.remove()">Skip intro</button>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
